<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <span class="badge">CSS</span>
        <h1>Связаться с нами</h1>

        <form>

            <div class="form-group">
                <label for="name">Твоё имя</label>
                <input type="text" id="name" name="name" placeholder="Введите имя" required>
            </div>

            <div class="form-group">
                <label for="email">Твой email</label>
                <input type="email" id="email" name="email" placeholder="Введите email" required>
            </div>

            <div class="form-group">
                <label for="message">Сообщение</label>
                <textarea id="message" name="message" rows="5" placeholder="Напишите сообщение..." required ></textarea>
            </div>

            <button id="submit-btn" type="submit" style="margin-top: 10px;">Отправить сообщение →</button>

        </form>

        <footer class="footer">
            Форма обратной связи создана с использованием HTML и CSS.
        </footer>

    </div>

</html>
